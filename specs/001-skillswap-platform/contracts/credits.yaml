openapi: 3.0.3
info:
  title: SkillSwap Credits API
  version: 1.0.0
  description: |
    Credit balance management, transaction history, credit purchases.
    Implements FR-026 to FR-031 (credit system).

servers:
  - url: http://localhost:3000/api
    description: Development server

tags:
  - name: Credits
    description: Credit balance and transaction operations

paths:
  /companies/{companyId}/credits:
    get:
      tags: [Credits]
      summary: Get company credit balance
      description: |
        Returns current credit balance and summary (FR-026).
        Balance can be negative (FR-027).
      operationId: getCompanyCredits
      security:
        - bearerAuth: []
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Credit balance
          content:
            application/json:
              schema:
                type: object
                properties:
                  balance:
                    type: integer
                    example: -50
                    description: Current balance (can be negative, FR-027)
                  currency:
                    type: string
                    example: "credits"
                  isPurchaseRequired:
                    type: boolean
                    description: True if balance is negative
                  recentTransactions:
                    type: array
                    items:
                      $ref: '#/components/schemas/CreditTransaction'
                    description: Last 5 transactions
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not authorized to view this company's credits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'

  /companies/{companyId}/credits/transactions:
    get:
      tags: [Credits]
      summary: Get credit transaction history
      description: |
        Returns all credit movements with filters (FR-031).
        Transactions recorded with timestamp, parties, and exchange reference.
      operationId: getCreditTransactions
      security:
        - bearerAuth: []
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: type
          in: query
          description: Filter by transaction type
          schema:
            type: string
            enum: [exchange, purchase, adjustment]
        - name: startDate
          in: query
          description: Filter transactions after this date
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          description: Filter transactions before this date
          schema:
            type: string
            format: date
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
      responses:
        '200':
          description: Transaction history
          content:
            application/json:
              schema:
                type: object
                properties:
                  transactions:
                    type: array
                    items:
                      $ref: '#/components/schemas/CreditTransaction'
                  summary:
                    type: object
                    properties:
                      totalGained:
                        type: integer
                        description: Sum of positive transactions
                      totalSpent:
                        type: integer
                        description: Sum of negative transactions
                      netChange:
                        type: integer
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /companies/{companyId}/credits/purchase:
    post:
      tags: [Credits]
      summary: Purchase credit package
      description: |
        Purchase credits to restore balance (FR-030).
        Requires re-authentication (FR-042 - critical operation).
        MVP uses manual invoice/bank transfer (no payment gateway).
      operationId: purchaseCredits
      security:
        - bearerAuth: []
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [packageId, reauthToken]
              properties:
                packageId:
                  type: string
                  enum: [small, medium, large, custom]
                  description: Predefined credit packages (FR-030)
                amount:
                  type: integer
                  nullable: true
                  description: Custom amount (if packageId = custom)
                reauthToken:
                  type: string
                  description: Re-authentication token (FR-042)
      responses:
        '201':
          description: Credit purchase initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  transaction:
                    $ref: '#/components/schemas/CreditTransaction'
                  invoice:
                    type: object
                    properties:
                      invoiceId:
                        type: string
                      amount:
                        type: integer
                      currency:
                        type: string
                        example: "EUR"
                      status:
                        type: string
                        enum: [pending, paid]
                      instructions:
                        type: string
                        description: Bank transfer instructions for MVP
        '400':
          description: Invalid package or missing re-authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                noReauth:
                  value:
                    error: "Validation Failed"
                    message: "Re-authentication required for credit purchase (FR-042)"
                    code: "REAUTH_REQUIRED"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'

  /credit-packages:
    get:
      tags: [Credits]
      summary: Get available credit packages
      description: Returns predefined credit packages with pricing (FR-030)
      operationId: getCreditPackages
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Credit packages
          content:
            application/json:
              schema:
                type: object
                properties:
                  packages:
                    type: array
                    items:
                      $ref: '#/components/schemas/CreditPackage'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    CreditTransaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
          description: Company affected
        amount:
          type: integer
          example: -10
          description: Positive = gained, negative = spent
        type:
          type: string
          enum: [mission, purchase, adjustment]
          description: Transaction type
        description:
          type: string
          example: "Mission #123: Provided senior developer for 1 week"
        mission:
          $ref: '#/components/schemas/MissionRef'
          nullable: true
          description: Related mission (if type = mission)
        initiatedBy:
          $ref: '#/components/schemas/UserRef'
          nullable: true
          description: User who initiated transaction
        createdAt:
          type: string
          format: date-time
          description: Transaction timestamp (FR-031)

    CreditPackage:
      type: object
      properties:
        id:
          type: string
          example: "small"
        name:
          type: string
          example: "Small Package"
        credits:
          type: integer
          example: 50
          description: Number of credits in package
        price:
          type: integer
          example: 5000
          description: Price in cents (EUR)
        currency:
          type: string
          example: "EUR"
        description:
          type: string
          example: "Good for 2-3 short missions"

    MissionRef:
      type: object
      nullable: true
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string

    UserRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        code:
          type: string

  responses:
    BadRequest:
      description: Invalid request data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    RateLimitExceeded:
      description: Rate limit exceeded (FR-045)
      headers:
        X-RateLimit-Limit:
          schema:
            type: integer
        X-RateLimit-Remaining:
          schema:
            type: integer
        X-RateLimit-Reset:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
